name: Tests

on:
  push:
    branches:
      - assistant/fix-local-api-routing
      - feature/investigation-refinement
      - production-hardening
      - release/evidence-backed-autonomy
      - ux-autonomy-redesign
  pull_request:
    branches:
      - assistant/fix-local-api-routing
      - feature/investigation-refinement
      - production-hardening
      - release/evidence-backed-autonomy

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile Python modules
        run: python -m compileall -q agent.py main.py schemas.py tools.py scoring.py watchtower.py evidence_manifest.py threat_intelligence.py elastic_intelligence.py render_dispatch.py render_workflow_tasks.py
      - name: Validate frontend JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          source = Path("frontend/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", source, flags=re.DOTALL)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline application script, found {len(scripts)}")
          Path("/tmp/scamairbag-frontend.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/scamairbag-frontend.js
      - name: Validate Postman collection JSON
        run: python -m json.tool postman/ScamAirbag.postman_collection.json > /dev/null
      - name: Run regression tests
        env:
          GEMINI_API_KEY: ""
        run: python -m pytest -q
