services:
  - type: web
    name: scamairbag-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: scamairbag-watchtower-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CORS_ORIGINS
        value: https://scamairbag-web-sqh8.onrender.com
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: ELASTIC_STORE_CASES
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-2.5-flash
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: ELASTICSEARCH_URL
        sync: false
      - key: ELASTIC_API_KEY
        sync: false
      - key: ELASTIC_INDEX
        value: scamairbag-investigations
      - key: ELASTIC_TIMEOUT_SECONDS
        value: "5"
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_INDEX_TASK_SLUG
        sync: false
      - key: WATCHTOWER_PUBLIC_API_URL
        sync: false
      - key: WATCHTOWER_INGEST_TOKEN
        sync: false
      - key: WATCHTOWER_DB_PATH
        value: /var/data/watchtower.sqlite3
      - key: WATCHTOWER_DEMO_ENABLED
        value: "false"
      - key: WATCHTOWER_SHARE_ANONYMIZED_INTELLIGENCE
        value: "false"
      - key: PAYPAL_WEBHOOK_ID
        sync: false

  - type: static
    name: scamairbag-web
    buildCommand: echo "Publishing ScamAirbag frontend"
    staticPublishPath: ./frontend
